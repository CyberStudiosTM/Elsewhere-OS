# Builds Elsewhere Messenger for macOS (universal: Apple Silicon + Intel) and attaches it to the release.
# Runs automatically when a messenger-v* release is published, or by hand for any existing release tag.
# The Mac app is not code-signed yet, so the first time people right-click the app and choose Open.
name: Messenger · macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Mac build to (for example messenger-v0.2.49)
        required: true

permissions:
  contents: write

jobs:
  mac:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'messenger-v')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Elsewhere Messenger
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Elsewhere Messenger/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Elsewhere Messenger/src-tauri -> target

      - name: Install
        run: npm ci

      - name: Build (universal, unsigned)
        run: npx tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#messenger-v}"
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "Elsewhere-Messenger_${VERSION}_macOS_universal.dmg"
          gh release upload "$TAG" "Elsewhere-Messenger_${VERSION}_macOS_universal.dmg" --clobber
